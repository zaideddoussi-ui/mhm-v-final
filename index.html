*,::before,::after{box-sizing:border-box}
html{background:#e3bc25;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#e3bc25 var(--img-paper) center top/cover no-repeat}
h1,h2,h3,h4,p,ol{margin:0}h1,h2,h3,h4{font-weight:inherit;font-size:inherit}
img{display:block;max-width:100%;height:auto;-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit}textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 1rem}
.hidden,[hidden]{display:none!important}
.hand{font-family:'Patrick Hand SC','Patrick Hand',cursive}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.2)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--ink),0 8px 0 rgba(0,0,0,.14)}50%{box-shadow:0 0 0 3px var(--red),0 0 36px rgba(229,72,77,.6)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- Bandeau des logos (comme l'affiche) + barre collante ---------- */
.logos{background:#fff}
.logos .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;height:clamp(66px,12vw,96px)}
.logos img{height:78%;width:auto;object-fit:contain}.logos .ens{height:52%}
.bar{position:sticky;top:0;z-index:30;background:rgba(227,188,37,.95);border-bottom:2px solid var(--ink)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.mark{display:flex;align-items:center;gap:.55rem;text-decoration:none;font:400 1.25rem Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.mark img{width:34px;height:34px;filter:invert(1)}.mark em{font-style:normal;background:var(--ink);color:var(--pop);padding:0 .35rem;border-radius:3px}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.lang button{padding:.25rem .85rem;font:700 .8rem Inter;min-height:34px}.lang button.on{background:var(--ink);color:var(--pop)}

/* ---------- Héros ---------- */
.hero{position:relative;padding:1.6rem 0 1.2rem;overflow:hidden}
.hero-top{position:relative;text-align:center}
.title{position:relative;z-index:2;width:min(86%,540px);margin:0 auto;filter:drop-shadow(0 5px 0 rgba(0,0,0,.1))}
.art{position:absolute;pointer-events:none;z-index:1}
.silh1{left:-3%;top:-2.2rem;width:clamp(86px,25vw,210px);transform:rotate(-5deg)}
.dash1{right:7%;top:12%;width:clamp(14px,3.6vw,32px)}.dash2{left:10%;top:40%;width:clamp(14px,3.6vw,32px)}
.theme{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;margin:-.9rem auto 0}
.brush{display:inline-block;background:var(--img-brush) center/100% 100% no-repeat;padding:.75rem 1.7rem .65rem;transform:rotate(-3deg);margin-bottom:-.55rem;position:relative;z-index:2}
.brush small{font:700 .82rem 'Patrick Hand SC',cursive;letter-spacing:.16em;color:#fff;white-space:nowrap}
.torn{display:inline-block;background:var(--img-tape) center/100% 100% no-repeat;padding:1.2rem 2.2rem 1rem;transform:rotate(-4deg)}
.torn b{font:700 clamp(1.5rem,7vw,2.4rem) 'Patrick Hand SC',cursive;letter-spacing:.07em;color:#a86e00;white-space:nowrap}
.hero h1{font:400 clamp(2.3rem,10vw,3.8rem)/1.02 Anton,Impact,sans-serif;text-transform:uppercase;text-align:center;margin-top:1.5rem;letter-spacing:.01em}
.ink{display:inline-block;background:var(--img-brush) center/100% 100% no-repeat;color:var(--pop);padding:.12em .55em .08em;margin-top:.1em;transform:rotate(-1.5deg)}
.sub{max-width:30rem;margin:1rem auto 0;text-align:center;font-weight:500;font-size:1.05rem}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.8rem 1rem;margin-top:1.3rem}
.btn-ink{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;background:var(--ink);color:var(--pop);font:400 1.2rem Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:1rem 2rem;min-height:54px;transition:transform .2s,opacity .2s;
  clip-path:polygon(0 8%,3% 0,10% 6%,18% 0,27% 5%,36% 0,46% 6%,57% 0,68% 5%,79% 0,90% 6%,100% 1%,100% 93%,95% 100%,84% 94%,72% 100%,60% 95%,48% 100%,36% 94%,24% 100%,12% 95%,0 100%)}
.btn-ink:hover:not(:disabled){transform:translateY(-2px) rotate(-.6deg)}.btn-ink:disabled{opacity:.45;cursor:not-allowed}
.btn-ink.ghost{background:#fff;color:var(--ink)}
.cd{font:700 1rem 'Patrick Hand SC',cursive;letter-spacing:.06em;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.15rem .9rem}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;max-width:34rem;margin:1.4rem auto 0;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border:2px solid var(--ink);border-radius:.8rem;padding:.55rem .4rem .5rem;text-align:center;font:700 .86rem/1.2 'Patrick Hand SC',cursive;letter-spacing:.04em;text-transform:uppercase;position:relative}
.steps li::before{content:counter(s);display:block;margin:-1.05rem auto .15rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ink);color:var(--pop);font:400 .95rem/1.5rem Anton,sans-serif}
.hero-bottom{position:relative;display:grid;grid-template-columns:38% 1fr;gap:.4rem;align-items:end;margin-top:2.6rem;min-height:200px}
.cam{position:relative}.cam .camera{width:128%;max-width:none;margin-left:-20%}.cam .film{position:absolute;left:-6%;top:-26%;width:34%;opacity:.95}
.stickers{position:relative;display:grid;gap:.9rem;justify-items:end;padding-bottom:.5rem}
.silh2{position:absolute;right:-2%;top:-2.6rem;width:clamp(84px,23vw,220px);z-index:0}
.sticker{position:relative;z-index:1;width:min(100%,340px);padding:1rem .8rem 1rem 3.7rem;background:var(--img-torn1) center/100% 100% no-repeat;transform:rotate(-2deg);min-height:88px;display:flex;flex-direction:column;justify-content:center;font-family:'Patrick Hand SC',cursive;text-transform:uppercase}
.sticker.spot{background-image:var(--img-torn2);transform:rotate(1.5deg)}
.sticker .ic{position:absolute;left:-.3rem;top:50%;width:54px;transform:translateY(-50%) rotate(-6deg)}
.sticker small{font-size:1rem;font-weight:700;letter-spacing:.1em}.sticker b{font-size:1.12rem;line-height:1.15;letter-spacing:.03em}

/* ---------- Mise en page ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;margin-top:1.8rem;align-items:start}.layout>*{min-width:0}
.sec-title{font:400 clamp(1.7rem,6vw,2.3rem)/1 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem}
.chip{border:2px solid var(--ink);border-radius:999px;padding:.35rem .95rem;font:600 .84rem Inter;color:var(--ink);background:rgba(255,255,255,.55);min-height:40px;display:inline-flex;align-items:center;gap:.45rem;transition:background .2s,color .2s,transform .2s}
.chip:hover{background:#fff}.chip.on{background:var(--ink);color:var(--pop)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#999);border:1.5px solid var(--ink);flex:none}.chip.on .dot{border-color:#fff}

/* ---------- Écrire : feuille de cahier déchirée ---------- */
#composerBox{position:relative;filter:drop-shadow(0 7px 0 rgba(0,0,0,.14))}
#composerBox::before{content:"";position:absolute;top:-18px;left:50%;width:128px;height:36px;transform:translateX(-50%) rotate(-3deg);background:var(--img-tape) center/100% 100% no-repeat;z-index:3;pointer-events:none}
.compose{background:var(--paper);padding:2rem 1.1rem 1.4rem;
  clip-path:polygon(0 1%,4% 0,9% 1.2%,15% .2%,22% 1.1%,29% 0,36% 1%,44% .1%,52% 1.1%,60% 0,68% 1%,76% .2%,84% 1.1%,92% 0,100% .9%,100% 99%,94% 100%,86% 98.9%,78% 100%,70% 99%,62% 100%,54% 98.9%,46% 100%,38% 99%,30% 100%,22% 98.9%,14% 100%,6% 99%,0 100%)}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.c-head h2{font:400 1.7rem/1 Anton,Impact,sans-serif;text-transform:uppercase}
#draftNote{font:700 .8rem 'Patrick Hand SC',cursive;color:var(--muted);opacity:0;transition:opacity .4s}#draftNote.show{opacity:1}
.starters{display:flex;gap:.45rem;margin:.9rem -.2rem .6rem;padding:0 .2rem .3rem;overflow-x:auto;scrollbar-width:none}.starters::-webkit-scrollbar{display:none}
.starters .chip{flex:none;font-size:.78rem;min-height:36px;padding:.2rem .8rem;white-space:nowrap}
#story{display:block;width:100%;min-height:204px;max-height:62vh;resize:none;overflow-y:auto;border:0;border-left:3px solid rgba(229,72,77,.55);outline:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(0,0,0,.15) 33px,rgba(0,0,0,.15) 34px);background-attachment:local;padding:0 0 0 .8rem;font:400 1.32rem/34px 'Patrick Hand',cursive;color:#111;caret-color:var(--red)}
#story::placeholder{color:rgba(60,48,20,.45)}
.meter{height:5px;border-radius:5px;background:rgba(0,0,0,.12);margin:.7rem 0 .35rem;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s,background .3s}
.c-row{display:flex;justify-content:space-between;gap:1rem;font-size:.78rem;color:var(--muted);font-weight:500}#count.warn{color:#b06a00}#count.max{color:var(--red);font-weight:700}
.moods{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 .8rem}
.consent{display:flex;gap:.65rem;align-items:flex-start;font-size:.86rem;line-height:1.35;font-weight:500;padding:.6rem .7rem;border:2px dashed rgba(0,0,0,.3);border-radius:.8rem;cursor:pointer}
.consent input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ink)}.consent.shake{animation:shake .45s;border-color:var(--red)}
.note{font-size:.76rem;color:var(--muted);margin:.7rem 0 1rem;line-height:1.4}
#cform .btn-ink{width:100%}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,210,63,.4);border-top-color:var(--pop);animation:spin .7s linear infinite}
#done{padding:2.4rem 1.2rem;text-align:center;animation:rise .5s ease}
#done .ring{width:68px;height:68px;margin:0 auto 1rem;border-radius:50%;background:var(--ink);color:var(--pop);display:flex;align-items:center;justify-content:center;font:400 2rem Anton,sans-serif}
#done h2{font:400 1.9rem/1.05 Anton,Impact,sans-serif;text-transform:uppercase}#done p{margin-top:.5rem;font-weight:500}
#done .btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.3rem}

/* ---------- Lire : papiers collés sur le mur jaune ---------- */
.feed-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem}
.feed-head small{white-space:nowrap;font:700 1rem 'Patrick Hand SC',cursive;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 .7rem;vertical-align:middle}
.sort,.filters{display:flex;flex-wrap:wrap;gap:.45rem}.filters{margin:.9rem 0 1.4rem}
#feed{display:flex;flex-direction:column;gap:1.5rem}
.card{position:relative;background:var(--paper);border-top:6px solid var(--c,var(--ink));border-radius:3px;padding:1.2rem 1.1rem 1rem;box-shadow:0 6px 0 rgba(0,0,0,.15),0 14px 26px -12px rgba(0,0,0,.45);animation:rise .5s ease backwards;transition:transform .3s,opacity .45s}
.card:nth-child(odd){transform:rotate(-.35deg)}.card:nth-child(even){transform:rotate(.3deg)}
.card::before{content:"";position:absolute;top:-17px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--img-tape) center/100% 100% no-repeat;pointer-events:none}
.card.still{animation:none}.card.leaving{opacity:0;transform:translateX(50px) scale(.96)}.card.fresh{animation:glow 1.4s ease 4}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem;font:700 .86rem 'Patrick Hand SC',cursive;letter-spacing:.05em;color:var(--muted)}
.mood{display:inline-flex;align-items:center;gap:.45rem;background:var(--ink);color:var(--pop);font:700 .86rem 'Patrick Hand SC',cursive;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:.12rem .65rem}.mood .dot{border-color:var(--pop)}
.meta{text-align:right}
.story{white-space:pre-line;overflow-wrap:anywhere;font:400 1.24rem/1.5 'Patrick Hand',cursive;color:#161616}
.story.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:.5rem;font:700 .86rem Inter;text-decoration:underline;color:var(--blue)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:1rem}
.vote{border:2px solid var(--ink);border-radius:999px;padding:.4rem .9rem;font:600 .85rem Inter;color:var(--ink);background:#fff;min-height:44px;transition:background .2s,color .2s,transform .2s}
.vote:hover{background:#f1e7cf}.vote b{font-weight:800}
.vote.up.on{background:var(--green);border-color:#1c6b34;color:#fff}.vote.down.on{background:var(--red);border-color:#a82b30;color:#fff}.vote.cm.on{background:var(--ink);color:var(--pop)}
.vote.pop{animation:pop .4s}.vote.del{margin-left:auto;background:var(--red);color:#fff;border-color:#a82b30}
.thread{margin-top:.9rem;padding-top:.8rem;border-top:2px dashed rgba(0,0,0,.25)}
.cmt{display:flex;gap:.6rem;align-items:flex-start;margin-top:.5rem;padding:.6rem .8rem;border-radius:.7rem;background:#fff;border:1px solid rgba(0,0,0,.12);font-size:.95rem;line-height:1.4;overflow-wrap:anywhere}
.cmt small{display:block;color:var(--muted);font-size:.72rem;margin-top:.15rem}.cmt .cdel{margin-left:auto;color:var(--red);padding:.3rem .5rem;font-weight:700}
.cform{display:flex;gap:.5rem;margin-top:.7rem}
.cin{flex:1;min-width:0;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.6rem 1rem;font-size:16px;outline:none}
.chint{font-size:.74rem;color:var(--muted);margin-top:.5rem}
.empty,.sync{text-align:center;font-weight:600;font-size:.9rem}.empty{padding:2.4rem 1rem;border:3px dashed rgba(0,0,0,.35);border-radius:1rem;background:rgba(255,255,255,.35)}
.skel{height:140px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.7),rgba(255,255,255,.35));background-size:200% 100%;animation:sk 1.4s linear infinite}@keyframes sk{to{background-position:-200% 0}}
#moreBtn{margin:1.4rem auto 0;display:flex}.sync{margin:1.6rem 0 0;color:var(--muted)}.sync.bad{color:#8a1d1d}

/* ---------- Aide : papier noir ---------- */
.help{margin:3rem 0 1.5rem;background:var(--ink);color:#fff;padding:1.6rem 1.2rem;
  clip-path:polygon(0 1.2%,5% 0,12% 1.2%,20% 0,29% 1%,38% 0,47% 1.2%,57% 0,66% 1%,75% 0,85% 1.2%,93% 0,100% 1%,100% 98.8%,94% 100%,84% 99%,74% 100%,63% 98.8%,52% 100%,41% 99%,30% 100%,19% 98.8%,9% 100%,0 99%)}
.help h3{font:400 1.6rem/1.05 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--pop)}.help p{margin-top:.5rem;font-size:.92rem;opacity:.9}
.erows{display:grid;gap:.6rem;margin-top:1rem}
.erow{display:flex;align-items:center;gap:.9rem;padding:.75rem .9rem;border-radius:.9rem;background:#fff;color:#111;text-decoration:none;min-height:56px}
.erow b{font:400 1.8rem Anton,sans-serif;color:var(--red);min-width:3.4rem}.erow span{font-size:.88rem;line-height:1.25}.erow em{margin-left:auto;font-style:normal;font:700 .74rem Inter;background:var(--ink);color:var(--pop);border-radius:999px;padding:.4rem .85rem}

/* ---------- Pied de page ---------- */
footer{text-align:center;padding:1rem 1rem calc(2.2rem + 64px);font-size:.82rem;font-weight:500}
.sponsors{display:flex;align-items:center;justify-content:center;gap:clamp(.8rem,4vw,1.8rem);background:#fff;border-radius:999px;padding:.65rem 1.3rem;margin:.6rem auto 1.1rem;width:max-content;max-width:100%}
.sponsors img{height:clamp(26px,7vw,40px);width:auto}
#adminOpen{opacity:.45;font-size:1rem;padding:.5rem}#adminOpen:hover{opacity:1}

/* ---------- Bouton flottant (téléphone), barre admin, modales, toast ---------- */
#fab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;transform:translate(-50%,160%);transition:transform .35s ease;white-space:nowrap}
#fab.show{transform:translate(-50%,0)}
#adminBar{position:relative;z-index:40;text-align:center;font-size:.86rem;font-weight:600;padding:.55rem .8rem;background:var(--ink);color:var(--pop)}#adminBar button{margin-left:.7rem;text-decoration:underline}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(25,18,2,.72);display:none;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .35s}
.overlay.show{display:flex}.overlay.in{opacity:1}
.modal{width:100%;max-width:430px;max-height:92vh;overflow:auto;padding:1.5rem;background:var(--paper);border-radius:6px;border-top:6px solid var(--ink);transform:translateY(14px);transition:transform .35s}.overlay.in .modal{transform:none}
.modal h3{font:400 1.6rem/1.05 Anton,Impact,sans-serif;text-transform:uppercase}.modal p{font-size:.92rem;margin-top:.7rem}
.modal input{width:100%;margin-top:1rem;background:#fff;border:2px solid var(--ink);border-radius:.7rem;padding:.8rem 1rem;font-size:16px;outline:none}
.modal .row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem}.modal .btn-ink{padding:.7rem 1.4rem;min-height:46px;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:var(--pop);padding:.7rem 1.2rem;border-radius:999px;opacity:0;transition:all .35s;z-index:90;font-weight:600;font-size:.9rem;max-width:92vw;text-align:center;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
noscript{display:block;text-align:center;padding:2rem;font-weight:700}

/* ---------- Ordinateur ---------- */
@media (min-width:900px){
  .hero{padding-top:1.6rem}.title{width:500px}.silh1{left:4%;top:-1rem;width:210px}.dash1{right:20%}.dash2{left:20%}
  .hero-bottom{grid-template-columns:1fr 1fr;margin-top:3rem;min-height:300px}.cam .camera{width:100%;margin-left:-4%}.cam .film{left:30%;top:-12%;width:110px}
  .silh2{right:6%;top:-5.4rem;width:220px}.sticker{width:360px}
  .layout{grid-template-columns:minmax(380px,430px) minmax(0,1fr);gap:2.6rem}
  #fab{display:none}.toast{bottom:1.6rem}footer{padding-bottom:2.4rem}
}
@media (min-width:900px) and (min-height:820px){#composerBox{position:sticky;top:76px}
  #story{max-height:48vh}
}
@media (min-width:640px) and (max-width:899px){.layout{max-width:640px;margin-left:auto;margin-right:auto}.hero-bottom{max-width:640px;margin-left:auto;margin-right:auto}}
@media (max-width:380px){.hero h1{font-size:2.15rem}.steps li{font-size:.78rem}.btn-ink{padding:.9rem 1.3rem;font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const mem = {};
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } }
};
const VOTER = (() => { let v = ls.get('mhm_voter', null); if (!v) { v = rid(); ls.set('mhm_voter', v); } return v; })();   // identifiant anonyme d'appareil : un vote par appareil
let lang = ls.get('mhm_lang', 'fr'); if (!I18N[lang]) lang = 'fr';
const t = (k, v) => { let s = (I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.fr[k]); if (typeof s === 'string' && v) for (const x in v) s = s.replace('{' + x + '}', v[x]); return s; };
const moodLabel = m => (MOOD_LABEL[lang][m] || m);
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3000); }
function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return t('ago_now'); if (m < 60) return t('ago_min', { n: m });
  const h = Math.floor(m / 60); if (h < 24) return t('ago_h', { n: h });
  return t('ago_d', { n: Math.floor(h / 24) });
}
function openModal(id) { const o = $(id); o.classList.add('show'); requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('in'))); }
function closeModal(id) { const o = $(id); o.classList.remove('in'); setTimeout(() => o.classList.remove('show'), 400); }

/* =========================================================
   COUCHE DONNÉES : cloud (API Vercel + Supabase) | offline | local (aperçu file://)
   ========================================================= */
const Store = {
  mode: 'cloud', loaded: false, posts: [], votes: {}, adminKey: null, hold: 0, onChange() {},
  seeds() {
    const now = Date.now(), H = 3600e3;
    return [
      { id: 's1', mood: 'Études', ts: now - 3 * H, up0: 24, down0: 1, text: 'Semaine d’examens, je dors trois heures par nuit et j’ai l’impression que tout le monde avance plus vite que moi. Je souris en cours, mais le soir je m’écroule.' },
      { id: 's2', mood: 'Solitude', ts: now - 26 * H, up0: 41, down0: 2, comments: [{ id: 'c1', ts: now - 20 * H, text: 'Merci de l’avoir écrit. Tu n’es vraiment pas seul(e).' }], text: 'Loin de ma famille depuis la rentrée. Dans une classe de 40 personnes, je me sens parfois totalement invisible. Si tu lis ça et que tu ressens la même chose : on est plus nombreux qu’on le croit.' },
      { id: 's3', mood: 'Espoir', ts: now - 70 * H, up0: 33, down0: 0, text: 'J’ai enfin osé en parler à un ami. Il n’a rien dit de spécial, il est juste resté là. Ça a suffi pour que je respire mieux.' }
    ];
  },
  async api(path, opt = {}) {
    const r = await fetch('/api/' + path, { method: opt.method || 'GET', cache: 'no-store', body: opt.body ? JSON.stringify(opt.body) : undefined,
      headers: { 'content-type': 'application/json', ...(opt.admin && this.adminKey ? { 'x-admin-key': this.adminKey } : {}) } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || r.status), { status: r.status });
    return j;
  },
  async init() {
    try { this.adminKey = sessionStorage.getItem('mhm_ak'); } catch (e) {}
    try { this.apply(await this.api('data?voter=' + encodeURIComponent(VOTER))); this.mode = 'cloud'; }
    catch (e) {
      if (location.protocol === 'file:') { this.toLocal(); return; }
      this.mode = 'offline'; this.loaded = true; this.onChange(true);   // en ligne : on ne fait jamais semblant, on réessaie
    }
    setInterval(() => this.pull(), 15000); document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); });
  },
  apply(d) {   // le serveur donne les totaux ; on retire notre propre vote des bases pour que counts() le rajoute (mise à jour instantanée)
    this.posts = d.posts.map(p => ({ id: p.id, text: p.text, mood: p.mood, ts: p.ts, up0: p.up - (p.my === 1 ? 1 : 0), down0: p.down - (p.my === -1 ? 1 : 0), comments: p.comments || [] }));
    this.votes = {}; d.posts.forEach(p => { if (p.my) this.votes[p.id + '__' + VOTER] = p.my; });
    this.loaded = true; this.onChange();
  },
  async pull() {
    if (this.mode === 'local' || Date.now() < this.hold || document.hidden) return;
    try { const d = await this.api('data?voter=' + encodeURIComponent(VOTER)); if (this.mode === 'offline') this.mode = 'cloud'; this.apply(d); }
    catch (e) { if (this.mode === 'cloud') { this.mode = 'offline'; this.onChange(true); } }
  },
  guard() { if (this.mode === 'offline') throw Object.assign(new Error('offline'), { status: 0 }); },
  toLocal() { this.mode = 'local'; this.loaded = true; this.posts = ls.get('mhm_posts_v3', null) || this.seeds(); this.votes = ls.get('mhm_votes_v3', {}); this.onChange(true); },
  saveLocal() { if (this.mode === 'local') { ls.set('mhm_posts_v3', this.posts); ls.set('mhm_votes_v3', this.votes); } },
  counts() { const c = {}; this.posts.forEach(p => { c[p.id] = { up: p.up0 || 0, down: p.down0 || 0 }; }); Object.entries(this.votes).forEach(([k, v]) => { const pid = k.split('__')[0]; if (c[pid]) v === 1 ? c[pid].up++ : c[pid].down++; }); return c; },
  async add(post) {
    this.guard(); this.posts.unshift(post); this.hold = Date.now() + 4000; this.onChange(true); this.saveLocal();
    if (this.mode === 'cloud') {
      try { await this.api('post', { method: 'POST', body: { id: post.id, text: post.text, mood: post.mood } }); }
      catch (e) { this.posts = this.posts.filter(p => p.id !== post.id); this.hold = 0; this.onChange(true); throw e; }
      this.hold = 0; this.pull();
    }
  },
  async vote(pid, val) {   // val : 1, -1 ou 0 (annule)
    this.guard(); const k = pid + '__' + VOTER; if (val) this.votes[k] = val; else delete this.votes[k];
    this.hold = Date.now() + 3000; this.onChange(); this.saveLocal();
    if (this.mode === 'cloud') { try { await this.api('vote', { method: 'POST', body: { id: pid, voter: VOTER, v: val } }); this.hold = 0; } catch (e) { this.hold = 0; this.pull(); throw e; } }
  },
  async comment(pid, text) {
    this.guard(); const p = this.posts.find(x => x.id === pid); if (!p) return; const c = { id: 'c' + rid(), text, ts: Date.now() };
    (p.comments = p.comments || []).push(c); this.hold = Date.now() + 4000; this.onChange(true); this.saveLocal();
    if (this.mode === 'cloud') {
      try { const r = await this.api('comment', { method: 'POST', body: { id: pid, text } }); if (r.id) c.id = r.id; }
      catch (e) { p.comments = p.comments.filter(x => x !== c); this.hold = 0; this.onChange(true); throw e; }
      this.hold = 0; this.pull();
    }
  },
  async remove(id) {
    this.guard(); if (this.mode === 'cloud') await this.api('post/' + id, { method: 'DELETE', admin: true });
    this.posts = this.posts.filter(p => p.id !== id); this.onChange(true); this.saveLocal();
  },
  async removeComment(pid, cid) {
    this.guard(); if (this.mode === 'cloud') await this.api(`comment/${pid}/${cid}`, { method: 'DELETE', admin: true });
    const p = this.posts.find(x => x.id === pid); if (p) p.comments = (p.comments || []).filter(c => c.id !== cid); this.onChange(true); this.saveLocal();
  },
  async adminLogin(pwd) {
    if (this.mode === 'cloud') {
      try { const j = await this.api('admin', { method: 'POST', body: { password: pwd } }); if (!j.ok) return false; this.adminKey = pwd; try { sessionStorage.setItem('mhm_ak', pwd); } catch (e) {} return true; } catch (e) { return false; }
    }
    return pwd === CFG.ADMIN_PASSWORD;
  }
};

/* =========================================================
   ÉCRIRE : brouillon automatique, idées de départ, jauge, humeur, publication
   ========================================================= */
const story = $('#story'), sendBtn = $('#sendStory');
let pickedMood = 'Autre', sending = false, phIdx = 0, sortMode = 'new', moodFilter = 'Tous', isAdmin = false, freshId = null, shown = 10;
try { isAdmin = sessionStorage.getItem('mhm_admin') === '1'; } catch (e) {}

function grow() { story.style.height = 'auto'; story.style.height = Math.min(story.scrollHeight + 2, innerHeight * .6) + 'px'; }
function updateComposer() {
  const n = story.value.length, len = story.value.trim().length;
  $('#count').textContent = n + ' / 1200'; $('#count').className = n > 1180 ? 'max' : n > 1000 ? 'warn' : '';
  $('#meterBar').style.width = (n / 12) + '%'; $('#meterBar').style.background = n > 1180 ? 'var(--neon)' : n > 1000 ? '#ffb454' : '';
  $('#minHint').textContent = len < 20 ? t('need', { n: 20 - len }) : '✓ ' + t('ready');
  sendBtn.disabled = sending || len < 20; grow();
}
let draftT; story.addEventListener('input', () => {
  updateComposer(); clearTimeout(draftT);
  draftT = setTimeout(() => { ls.set('mhm_draft', story.value); const d = $('#draftNote'); d.classList.add('show'); setTimeout(() => d.classList.remove('show'), 1600); }, 700);   // brouillon enregistré automatiquement
});
story.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('#cform').requestSubmit(); } });
function rotatePlaceholder() { story.placeholder = t('ph')[phIdx % t('ph').length]; phIdx++; }
setInterval(() => { if (!story.value && document.activeElement !== story) rotatePlaceholder(); }, 6000);
function buildStarters() {
  $('#starters').innerHTML = ''; t('starters').forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s;
    b.onclick = () => { story.value = story.value ? story.value : s + ' '; story.focus(); story.setSelectionRange(story.value.length, story.value.length); updateComposer(); ls.set('mhm_draft', story.value); };
    $('#starters').appendChild(b); });
}
function buildMoodChips() {
  const box = $('#moodPicker'); box.innerHTML = '';
  MOODS.forEach(m => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (m === pickedMood ? ' on' : ''); b.setAttribute('aria-pressed', m === pickedMood);
    b.innerHTML = '<i class="dot"></i><span></span>'; b.firstChild.style.setProperty('--c', MOOD_COL[m]); b.lastChild.textContent = moodLabel(m);
    b.onclick = () => { pickedMood = m; buildMoodChips(); }; box.appendChild(b); });
}
$('#cform').addEventListener('submit', async e => {
  e.preventDefault(); if (sending) return;
  const text = story.value.trim(); if (text.length < 20) return;
  if (!$('#consent').checked) { const r = $('#consentRow'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); return toast(t('t_consent')); }
  if (Date.now() - ls.get('mhm_last', 0) < 30000) return toast(t('t_wait'));
  sending = true; sendBtn.disabled = true; sendBtn.innerHTML = '<i class="spinner"></i><span>' + t('sending') + '</span>';
  const post = { id: 'p' + rid(), text, mood: pickedMood, ts: Date.now() };
  try {
    await Store.add(post);
    ls.set('mhm_last', Date.now()); ls.set('mhm_consent', true); ls.set('mhm_draft', ''); story.value = ''; updateComposer();
    sortMode = 'new'; moodFilter = 'Tous'; shown = Math.max(shown, 10); freshId = post.id; syncControls(); render(true);
    $('#cform').hidden = true; $('#done').hidden = false; $('#done').scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => { freshId = null; render(true); }, 9000);
    if (RISK.test(text)) setTimeout(() => openModal('#careOverlay'), 1400);
  } catch (err) { toast(err.status === 429 ? t('t_fast') : t('t_fail')); }
  sending = false; sendBtn.innerHTML = '<span data-i18n="publish">' + t('publish') + '</span>'; updateComposer();
});
$('#writeAgain').onclick = () => { $('#done').hidden = true; $('#cform').hidden = false; $('#consent').checked = true; story.focus(); $('#composerBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('#seeIt').onclick = () => { const c = $('#feed .card.fresh') || $('#feed .card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); };

/* =========================================================
   FIL : rendu optimisé, votes, commentaires, pagination
   ========================================================= */
let lastSig = '', pendingRender = false;
const seen = new Set(), openThreads = new Set(), openText = new Set(), drafts = {};
function syncControls() {
  document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('on', b.dataset.sort === sortMode));
  const box = $('#moodFilters'); box.innerHTML = '';
  ['Tous', ...MOODS].forEach(m => { const b = document.createElement('button'); b.className = 'chip' + (m === moodFilter ? ' on' : ''); b.setAttribute('aria-pressed', m === moodFilter);
    if (m === 'Tous') b.textContent = t('all'); else { b.innerHTML = '<i class="dot"></i><span></span>'; b.firstChild.style.setProperty('--c', MOOD_COL[m]); b.lastChild.textContent = moodLabel(m); }
    b.onclick = () => { moodFilter = m; shown = 10; syncControls(); render(true); }; box.appendChild(b); });
}
document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { sortMode = b.dataset.sort; shown = 10; syncControls(); render(true); });
$('#moreBtn').onclick = () => { shown += 10; render(true); };

function render(force) {
  const ae = document.activeElement;
  if (!force && ae && ae.classList && ae.classList.contains('cin')) { pendingRender = true; return; }   // on ne casse pas la saisie d'un commentaire
  const sig = JSON.stringify([Store.mode, Store.loaded, lang, sortMode, moodFilter, isAdmin, freshId, shown, [...openThreads], [...openText], Store.posts.map(p => [p.id, p.up0, p.down0, (p.comments || []).map(c => c.id)]), Store.votes]);
  if (!force && sig === lastSig) return; lastSig = sig;
  const feed = $('#feed'); $('#syncState').className = 'sync' + (Store.mode === 'offline' ? ' bad' : '');
  $('#syncState').textContent = t({ local: 'sync_local', cloud: 'sync_cloud', offline: 'sync_off' }[Store.mode]);
  if (!Store.loaded) { feed.innerHTML = '<div class="skel"></div><div class="skel"></div>'; return; }
  const counts = Store.counts(), num = {};
  [...Store.posts].sort((a, b) => a.ts - b.ts).forEach((p, i) => { num[p.id] = i + 1; });
  const all = Store.posts.filter(p => moodFilter === 'Tous' || p.mood === moodFilter);
  all.sort((a, b) => sortMode === 'top' ? (counts[b.id].up - counts[b.id].down) - (counts[a.id].up - counts[a.id].down) || b.ts - a.ts : b.ts - a.ts);
  $('#total').textContent = Store.posts.length ? t(Store.posts.length > 1 ? 'total_n' : 'total_1', { n: Store.posts.length }) : '';
  $('#empty').hidden = all.length > 0; $('#moreBtn').hidden = all.length <= shown;
  feed.innerHTML = '';
  all.slice(0, shown).forEach((p, i) => {
    const v = Store.votes[p.id + '__' + VOTER] || 0, c = counts[p.id], cs = p.comments || [], open = openThreads.has(p.id), isSeen = seen.has(p.id);
    const secs = Math.max(8, Math.round(p.text.split(/\s+/).length / 2.5)), long = p.text.length > 420, expanded = openText.has(p.id);
    const el = document.createElement('article'); el.className = 'card panel' + (p.id === freshId ? ' fresh' : '') + (isSeen ? ' still' : ''); el.dataset.id = p.id;
    el.style.setProperty('--c', MOOD_COL[p.mood] || '#b69cff'); el.style.animationDelay = isSeen ? '0ms' : (i * 45) + 'ms';
    el.innerHTML = `
      <div class="meta-row"><span class="mood"><i class="dot"></i><span class="ml"></span></span><span class="meta"></span></div>
      <p class="story${long && !expanded ? ' clamp' : ''}"></p>${long ? '<button class="more" data-act="more"></button>' : ''}
      <div class="actions">
        <button class="vote up${v === 1 ? ' on' : ''}" data-act="up">${t('up')} · <b>${c.up}</b></button>
        <button class="vote down${v === -1 ? ' on' : ''}" data-act="down">${t('down')} · <b>${c.down}</b></button>
        <button class="vote cm${open ? ' on' : ''}" data-act="cmt" aria-expanded="${open}">${t('cm')} · <b>${cs.length}</b></button>
        ${isAdmin ? `<button class="vote del" data-act="del">${t('del')}</button>` : ''}
      </div>
      ${open ? `<div class="thread">${cs.map(() => '<div class="cmt"><div><span class="ct"></span><small></small></div>' + (isAdmin ? `<button class="cdel" data-act="cdel" aria-label="${t('c_del')}">✕</button>` : '') + '</div>').join('')}
        <div class="cform"><input class="cin" maxlength="300" placeholder="${t('c_ph')}" aria-label="${t('c_ph')}" autocomplete="off"><button class="vote" data-act="csend">${t('c_send')}</button></div>
        <p class="chint">${t('c_hint')}</p></div>` : ''}`;
    el.querySelector('.story').textContent = p.text; el.querySelector('.ml').textContent = moodLabel(p.mood);
    const more = el.querySelector('.more'); if (more) more.textContent = expanded ? t('read_less') : t('read_more');
    const meta = el.querySelector('.meta'); meta.dataset.ts = p.ts; meta.dataset.n = num[p.id]; meta.dataset.dur = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); meta.textContent = t('meta', { n: String(num[p.id]).padStart(3, '0'), ago: ago(p.ts), dur: meta.dataset.dur });
    el.querySelectorAll('.cmt').forEach((n, k) => { n.dataset.cid = cs[k].id; n.querySelector('.ct').textContent = cs[k].text; const sm = n.querySelector('small'); sm.dataset.ts = cs[k].ts; sm.textContent = ago(cs[k].ts); });
    const inp = el.querySelector('.cin'); if (inp) inp.value = drafts[p.id] || '';
    feed.appendChild(el);
  });
  all.slice(0, shown).forEach(p => seen.add(p.id));
}
Store.onChange = render;
const tickAgo = () => document.querySelectorAll('.meta[data-ts]').forEach(n => { n.textContent = t('meta', { n: String(n.dataset.n).padStart(3, '0'), ago: ago(+n.dataset.ts), dur: n.dataset.dur }); });
setInterval(tickAgo, 60000);
document.addEventListener('focusout', e => { if (pendingRender && e.target.classList && e.target.classList.contains('cin')) { pendingRender = false; setTimeout(() => render(true), 60); } });

$('#feed').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('article'), p = Store.posts.find(x => x.id === card.dataset.id); if (!p) return;
  const act = btn.dataset.act;
  if (act === 'more') { openText.has(p.id) ? openText.delete(p.id) : openText.add(p.id); render(true); return; }
  if (act === 'cmt') { openThreads.has(p.id) ? openThreads.delete(p.id) : openThreads.add(p.id); render(true); if (openThreads.has(p.id)) { const inp = document.querySelector(`article[data-id="${p.id}"] .cin`); if (inp) inp.focus(); } return; }
  if (act === 'csend') { sendComment(p.id, card.querySelector('.cin')); return; }
  if (act === 'cdel') { try { await Store.removeComment(p.id, btn.closest('.cmt').dataset.cid); toast(t('t_del')); } catch (err) { toast(t('t_deny')); setAdmin(false); } return; }
  if (act === 'del') {
    if (!isAdmin) return; card.classList.add('leaving'); await sleep(450);
    try { await Store.remove(p.id); toast(t('t_del')); } catch (err) { toast(t('t_deny')); setAdmin(false); Store.pull(); } return;
  }
  const val = act === 'up' ? 1 : -1, prev = Store.votes[p.id + '__' + VOTER] || 0;
  Store.vote(p.id, prev === val ? 0 : val).catch(() => toast(t('t_vfail')));
});
async function sendComment(pid, input) {
  const txt = (input ? input.value : '').trim();
  if (txt.length < 2) return toast(t('t_cmin'));
  if (Date.now() - ls.get('mhm_lastc', 0) < 8000) return toast(t('t_cwait'));
  ls.set('mhm_lastc', Date.now()); input.value = ''; drafts[pid] = ''; input.blur();
  try { await Store.comment(pid, txt); } catch (e) { toast(e.status === 429 ? t('t_cwait') : t('t_cfail')); }
}
$('#feed').addEventListener('input', e => { if (e.target.classList.contains('cin')) drafts[e.target.closest('article').dataset.id] = e.target.value; });
$('#feed').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('cin')) { e.preventDefault(); sendComment(e.target.closest('article').dataset.id, e.target); } });

/* =========================================================
   MODÉRATION
   ========================================================= */
function setAdmin(v) {
  isAdmin = v; $('#adminBar').hidden = !v;
  try { if (v) sessionStorage.setItem('mhm_admin', '1'); else { sessionStorage.removeItem('mhm_admin'); sessionStorage.removeItem('mhm_ak'); Store.adminKey = null; } } catch (e) {}
  render(true);
}
$('#adminOpen').onclick = () => isAdmin ? toast(t('t_already')) : (openModal('#adminOverlay'), setTimeout(() => $('#adminPwd').focus(), 350));
$('#adminCancel').onclick = () => closeModal('#adminOverlay');
async function tryAdmin() {
  if (await Store.adminLogin($('#adminPwd').value)) { $('#adminPwd').value = ''; $('#adminErr').hidden = true; closeModal('#adminOverlay'); setAdmin(true); toast(t('t_welcome')); }
  else $('#adminErr').hidden = false;
}
$('#adminOk').onclick = tryAdmin; $('#adminPwd').addEventListener('keydown', e => e.key === 'Enter' && tryAdmin()); $('#adminExit').onclick = () => setAdmin(false);
$('#careOk').onclick = () => closeModal('#careOverlay');
addEventListener('keydown', e => { if (e.key === 'Escape') ['#adminOverlay', '#careOverlay'].forEach(closeModal); });

/* =========================================================
   LANGUE, DÉCOR (skyline + pluie), INITIALISATION
   ========================================================= */
function emergencyRows(extra) {
  return EMERGENCY.map(e => `<a class="erow" href="tel:${e.n}"><b>${e.n}</b><span><strong>${e[lang][0]}</strong><br>${e[lang][1]}</span><em>${t('call')}</em></a>`).join('');
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(n => { n.placeholder = t(n.dataset.i18nPh); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('#erows').innerHTML = emergencyRows(); $('#careRows').innerHTML = emergencyRows();
  sendBtn.innerHTML = '<span>' + t('publish') + '</span>'; story.setAttribute('aria-label', t('c_title'));
  buildStarters(); buildMoodChips(); syncControls(); rotatePlaceholder(); updateComposer(); updateCountdown(); render(true);
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; ls.set('mhm_lang', lang); applyLang(); });

/* Compte à rebours jusqu'au Focus 7 : 21 novembre à 09 h. ⚠️ Change l'année ici si besoin (mois : 10 = novembre). */
const EVENT_DATE = new Date(2026, 10, 21);
function updateCountdown() {
  const el = $('#countdown'), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), days = Math.round((EVENT_DATE - today) / 86400000);   // jours calendaires
  el.hidden = false; el.textContent = days > 0 ? t('cd_days', { n: days }) : days === 0 ? t('cd_today') : t('cd_over');
}
/* Bouton flottant « Écrire » : visible sur téléphone tant que la zone d'écriture est hors écran */
(function fab() {
  const fab = $('#fab'), box = $('#composerBox'); if (!('IntersectionObserver' in window)) return;
  let hidden = false; new IntersectionObserver(es => { hidden = es[0].isIntersecting; fab.classList.toggle('show', !hidden && scrollY > 200); }, { threshold: .05 }).observe(box);
  addEventListener('scroll', () => fab.classList.toggle('show', !hidden && scrollY > 200), { passive: true });
})();
$('#consent').checked = !!ls.get('mhm_consent', false);
story.value = ls.get('mhm_draft', '') || '';
$('#adminBar').hidden = !isAdmin;
applyLang();
Store.init().then(() => { render(true); });

</script>
</body>
